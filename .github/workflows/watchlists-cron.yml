name: Watchlists Cron

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: {}

jobs:
  run-watchlists:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          curl -sS -X POST "$APP_URL/api/scheduler/run-watchlists" \
            -H "content-type: application/json" \
            -H "x-scheduler-secret: $SCHEDULER_SECRET" \
            --data '{"trigger":"cron","limitItems":200}'
